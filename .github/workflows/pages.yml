name: Deploy Pages

# Builds the documentation website with Claide (https://github.com/kurodaki-dev/Claide)
# from DOCUMENTATION.md — see website/app.py — and publishes it to GitHub
# Pages, together with the playground (exemples/playground.html +
# ton618-lite.js), the AI skills page, the logo and exemples/CNAME (the
# custom domain).
#
# One-time setup: repo Settings → Pages → Source → "GitHub Actions" (instead
# of "Deploy from a branch"). After that this workflow runs on every push to
# main that touches the docs, the site or the playground, or manually via
# workflow_dispatch.

on:
  push:
    branches: [main]
    paths:
      - "DOCUMENTATION.md"
      - "website/**"
      - "exemples/**"
      - "include/Version.hpp"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Claide
        run: pip install "claide-web==0.5.0"

      - name: Build the website with Claide
        # With a custom domain (exemples/CNAME) the site lives at the domain's
        # root; without one, at https://<user>.github.io/<repo>/.
        run: |
          if [ -s exemples/CNAME ]; then export BASE_PATH=""; else export BASE_PATH="/${{ github.event.repository.name }}"; fi
          python website/app.py build _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
