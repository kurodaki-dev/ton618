name: CI

# Sanity-checks every push/PR to main: the interpreter must still build
# cleanly and run the bundled example scripts without crashing. This is the
# same `make` build a contributor runs locally (see DOCUMENTATION.md >
# "Building the interpreter") — release.yml handles the actual
# cross-compiled release binaries.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Run the test suite (language tests, then the package manager end to end)
        run: make test

      - name: Check the package registry
        run: python3 scripts/registry.py validate --ton618 ./ton618

      - name: Check the browser playground engine against the same tests
        run: |
          node tests/run-lite.js
          node tests/requests-lite.js
      - name: Acode plugin (headless Ace)
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/acode-deps" ace-builds@1.36.5 jsdom@24 @codemirror/language@6 @codemirror/state@6 @codemirror/view@6
          ACE_MODULES="$RUNNER_TEMP/acode-deps" node tests/acode.js
          ACE_MODULES="$RUNNER_TEMP/acode-deps" node tests/acode-cm.js

      - name: Run example scripts (smoke test)
        run: |
          ./ton618 exemples/test.ton
          ./ton618 exemples/test_import.ton
          ./ton618 exemples/test_mathutils.ton
          ./ton618 exemples/test_new_features.ton
          ./ton618 exemples/test_builtin_modules.ton
          ./ton618 exemples/test_module_guide.ton
          ./ton618 exemples/math.ton
          ./ton618 --version
          ./ton618 --help
