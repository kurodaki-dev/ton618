<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TON618 — Documentation</title>
<style>
  :root {
    --bg: #0a0a0d;
    --bg-raised: #121216;
    --line: #232329;
    --text: #d8d8de;
    --text-dim: #7c7c88;
    --accent: #ff7a3d;
    --accent-dim: #7a3d1f;
    --code-bg: #0f0f13;
    --serif: Georgia, "Times New Roman", serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--serif);
    margin: 0;
    line-height: 1.65;
  }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    padding: 4rem 1.5rem 3rem;
    text-align: center;
    overflow: hidden;
    border-bottom: 1px solid var(--line);
  }
  .hero::before {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 600px; height: 600px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, var(--accent-dim) 0%, transparent 70%);
    opacity: 0.35;
    pointer-events: none;
  }
  .hero-inner { position: relative; z-index: 1; }
  .hero h1 {
    font-family: var(--mono);
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    letter-spacing: -0.02em;
    margin: 0 0 0.5rem;
    color: #fff;
  }
  .hero h1 .dot { color: var(--accent); }
  .hero p.tagline {
    color: var(--text-dim);
    font-size: 1.05rem;
    max-width: 40em;
    margin: 0 auto;
    font-style: italic;
  }
  .nav-links {
    margin-top: 1.4rem;
    display: flex;
    justify-content: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .nav-links a {
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--text-dim);
    text-decoration: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.5rem 1.2rem;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .nav-links a:hover { color: #fff; border-color: var(--accent-dim); background: var(--bg-raised); }
  .nav-links a.primary { color: #fff; background: var(--accent-dim); border-color: var(--accent-dim); }

  .lang-switch {
    margin-top: 1.4rem;
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    font-family: var(--mono);
    font-size: 0.85rem;
  }
  .lang-switch a {
    padding: 0.5rem 1.4rem;
    color: var(--text-dim);
    text-decoration: none;
    transition: color 0.15s, background 0.15s;
    cursor: pointer;
  }
  .lang-switch a:hover { color: var(--text); background: var(--bg-raised); }
  .lang-switch a.active-en { color: #fff; background: var(--accent-dim); }

  /* ---------- Layout ---------- */
  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 3rem 1.5rem 6rem;
  }

  .lang-block { display: none; }
  .lang-block.visible { display: block; }

  /* ---------- Sections (one per markdown "###" heading) ---------- */
  .lang-block section.doc-section {
    margin-bottom: 3.2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  .lang-block section.doc-section:first-of-type { border-top: none; }

  .lang-block h2 {
    font-family: var(--mono);
    font-size: 1.4rem;
    color: #fff;
    margin: 0 0 1rem;
  }

  .lang-block h3 {
    font-family: var(--mono);
    font-size: 1.02rem;
    color: var(--text);
    margin: 1.8rem 0 0.6rem;
  }

  .lang-block p { margin: 0 0 1rem; }

  .lang-block a { color: var(--accent); }

  .lang-block strong { color: #fff; font-weight: 600; }
  .lang-block em { color: var(--text); }

  /* ---------- Code ---------- */
  .lang-block pre {
    background: var(--code-bg);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent-dim);
    border-radius: 4px;
    padding: 1rem 1.2rem;
    overflow-x: auto;
    margin: 0.8rem 0 1.2rem;
  }
  .lang-block code {
    font-family: var(--mono);
    font-size: 0.88rem;
  }
  .lang-block p code, .lang-block li code, .lang-block td code, .lang-block th code {
    background: var(--code-bg);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0.05rem 0.4rem;
    color: #ffb08a;
    font-size: 0.85em;
  }
  .lang-block pre code {
    color: var(--text);
    background: none;
    border: none;
    padding: 0;
  }

  /* ---------- Tables ---------- */
  .lang-block table {
    width: 100%;
    border-collapse: collapse;
    margin: 0.8rem 0 1.4rem;
    font-size: 0.92rem;
    display: block;
    overflow-x: auto;
  }
  .lang-block th, .lang-block td {
    text-align: left;
    padding: 0.55rem 0.8rem;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  .lang-block th {
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: 1px solid var(--accent-dim);
    white-space: nowrap;
  }
  .lang-block td code { white-space: nowrap; }

  /* ---------- Misc ---------- */
  .lang-block .note {
    border-left: 3px solid var(--accent-dim);
    background: var(--bg-raised);
    padding: 0.8rem 1.1rem;
    border-radius: 0 4px 4px 0;
    font-size: 0.92rem;
    color: var(--text-dim);
    margin: 1rem 0 1.4rem;
  }
  .lang-block .note strong { color: var(--text); }

  .lang-block ul, .lang-block ol { padding-left: 1.4rem; }
  .lang-block li { margin-bottom: 0.35rem; }

  /* The very first section of each language block is the table of contents,
     which the markdown itself renders as a plain numbered list — lay it out
     in two columns like a real TOC. */
  .lang-block section.doc-section:first-of-type ol {
    columns: 2;
    -webkit-columns: 2;
  }
  .lang-block section.doc-section:first-of-type li { break-inside: avoid; font-size: 0.92rem; }

  footer {
    text-align: center;
    padding: 3rem 1.5rem;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 0.8rem;
    border-top: 1px solid var(--line);
  }
  footer .dot { color: var(--accent); }
  footer a { color: var(--text-dim); }

  @media (max-width: 600px) {
    .lang-block section.doc-section:first-of-type ol { columns: 1; }
    .hero { padding: 3.5rem 1.2rem 3rem; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <h1>TON<span class="dot">618</span></h1>
    <p class="tagline" id="tagline">A simple interpreted programming language, written in C++.</p>
    <div class="nav-links">
      <a href="playground.html" class="primary">▶ Playground</a>
    </div>
    <div class="lang-switch">
      <a id="btn-en" class="active-en" onclick="setLang('en')">EN</a>
      <a id="btn-fr" onclick="setLang('fr')">FR</a>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="lang-block visible" id="block-en"></div>
  <div class="lang-block" id="block-fr"></div>
</div>

<footer>TON618<span class="dot">.</span>lang — documentation · <a href="playground.html">try it in the playground</a></footer>

<script type="text/markdown" id="doc-source">
