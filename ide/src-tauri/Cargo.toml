[package]
name = "ton618-ide"
version = "2.0.0"
description = "TON618 IDE"
authors = ["kurodaki-dev"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "ton618_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

# Small, fast binaries: optimize for size, link-time optimization, no debug symbols.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
